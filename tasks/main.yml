---
# Top-level installer for Oracle JDK

- name: Precondition - jdk_version
  fail: msg="ERROR - Required variable 'jdk_version' missing."
  when: jdk_version is not defined

- name: Derive java_version/java_subversion from jdk_version unless explicitly set
  set_fact:
    java_version: "{{ java_version if java_version is defined else (jdk_version.split('.')[0] | int) }}"
    java_subversion: "{{ java_subversion if java_subversion is defined else jdk_version.split('.', 1)[1] }}"

- import_tasks: set-platform-vars.yml

- name: Derive jdk_file_name (standard Oracle JDK9+ naming) unless explicitly set
  set_fact:
    jdk_file_name: "{{ jdk_file_name if jdk_file_name is defined else 'jdk-' ~ jdk_version ~ '_' ~ jdk_os ~ '-' ~ jdk_arch ~ '_bin' }}"

- import_tasks: set-jdk-vars.yml

- name: Install libselinux-python binary for Ansible to work
  yum: name=libselinux-python state=present
  when: ansible_pkg_mgr == "yum"

- name: Copy scripts to server (check-java-version.sh)
  copy: src="check-java-version.sh" dest="{{ java_download_path }}/" mode="a+x"

- name: Check if specific version of Oracle JDK is installed?
  command: "{{ java_download_path }}/check-java-version.sh {{ jdk_version }}"
  register: jdk_info
  changed_when: false
  failed_when: jdk_info.rc > 0

- import_tasks: generate_tmp.yml
  when: (jdk_info.stdout|from_json).not_found

- import_tasks: install.yml
  when: (jdk_info.stdout|from_json).not_found
